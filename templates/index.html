<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Большая зеленая кнопка</title>
    <style>
        body {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            font-family: Arial, sans-serif;
            background: #f5f5f5;
        }

        #counter {
            font-size: 24px;
            margin-bottom: 20px;
        }

        .button {
            width: 150px;
            height: 150px;
            border-radius: 50%;
            background: #4CAF50;
            border: none;
            color: white;
            font-size: 18px;
            cursor: pointer;
        }

        .button:hover {
            background: #45a049;
        }
    </style>
</head>
<body>

<div id="counter">Нажатий: {{ count }}</div>

<button class="button" onclick="handleClick()">ЖМИ</button>

<script>
    async function handleClick() {
        const response = await fetch('/click', {
            method: 'POST'
        });

        const data = await response.json();

        document.getElementById('counter').innerText = "Нажатий: " + data.count;

        alert(data.message);
    }
</script>

</body>
</html>
